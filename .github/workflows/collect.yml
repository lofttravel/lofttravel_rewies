name: Collect reviews

on:
  schedule:
    - cron: "23 3 * * *"
      timezone: "Europe/Minsk"
  workflow_dispatch:

concurrency:
  group: reviews-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run collect
        env:
          PUBLIC_BASE_URL: https://raw.githubusercontent.com/lofttravel/lofttravel_rewies/main/public

      - run: npm run validate

      - name: Save updated feed and optimized media
        run: |
          git config user.name "lofttravel-reviews-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public state
          if ! git diff --cached --quiet; then
            git commit -m "data: update reviews feed"
            git push
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: review-collector-diagnostics
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
